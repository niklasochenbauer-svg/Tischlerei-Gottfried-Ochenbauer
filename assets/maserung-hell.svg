<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Ahorn-Maserung für helle Flächen: gestreckte Rauschfelder werden zu feinen Konturlinien -->
  <filter id="m" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0011 0.013" numOctaves="3" seed="11" stitchTiles="stitch"/>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues="0 0 1 0 0 0 1 0 0 0 1 0 0 0 1 0"/>
    </feComponentTransfer>
    <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.24  0 0 0 0 0.11  0.055 0 0 0 0"/>
  </filter>
  <rect width="1200" height="800" filter="url(#m)"/>
</svg>
